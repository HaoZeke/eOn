name: Build and test native JobResult output

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on: [push, pull_request]

jobs:
  job_result:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: true
          cache-write: true
          activate-environment: true
          environments: >-
            dev-lite
      - name: Install cbindgen
        shell: pixi run bash -e {0}
        run: command -v cbindgen || cargo install cbindgen
      - name: Configure native JobResult build
        shell: pixi run bash -e {0}
        run: |
          meson setup bbdir \
            --prefix="$CONDA_PREFIX" \
            --libdir=lib \
            --buildtype release \
            -Dwith_job_result=true \
            -Dwith_tests=true
      - name: Compile native JobResult client
        shell: pixi run bash -e {0}
        run: meson compile -C bbdir eonclient
      - name: Run native compatibility tests
        shell: pixi run bash -e {0}
        run: |
          meson test -C bbdir test_confileio --print-errorlogs
          python -m pytest tests/test_job_result_schema.py -q
